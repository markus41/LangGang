inputSet:
  name: Development Environment
  identifier: dev_environment
  orgIdentifier: default
  projectIdentifier: langgang
  tags:
    environment: development
  pipeline:
    identifier: langgang_cicd
    stages:
      - stage:
          identifier: build_and_test
          type: CI
          spec:
            execution:
              steps:
                - step:
                    identifier: setup_python
                    type: Run
                    spec:
                      envVariables:
                        ENV: development
                        DEBUG: "true"
                        LOG_LEVEL: DEBUG

                - step:
                    identifier: run_tests
                    type: Run
                    spec:
                      envVariables:
                        PYTEST_ARGS: "-v -s"

      - stage:
          identifier: deploy
          type: Deployment
          spec:
            execution:
              steps:
                - step:
                    identifier: deploy_registry
                    type: Run
                    spec:
                      envVariables:
                        DEPLOY_TARGET: test-pypi
                        PYPI_URL: https://test.pypi.org/legacy/

