[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgang"
version = "0.2.0"
description = "AI-powered code templating with LangChain, LangGraph, and Maven archetypes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "LangGang Contributors"}
]
dependencies = [
    # Core LangChain ecosystem
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.2.0",

    # Optional LLM providers (for LLM-powered features)
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.1.0",

    # Template engines
    "cookiecutter>=2.5.0",
    "copier>=9.0.0",

    # Core utilities
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
    "bandit>=1.7.6",
]
gemini = [
    "langchain-google-genai>=1.0.0",
    "langchain-google-vertexai>=1.0.0",
    "google-generativeai>=0.3.0",
]

# Minimal install without LLM providers
minimal = [
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "cookiecutter>=2.5.0",
    "copier>=9.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

# Full install with all LLM providers
full = [
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/markus41/LangGang"
Repository = "https://github.com/markus41/LangGang"
Documentation = "https://github.com/markus41/LangGang#readme"

[project.scripts]
langgang = "langgang.mcp_server:main"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming (naming conventions)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PIE", # flake8-pie
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by black)
    "PLR0913",  # Too many arguments (sometimes necessary)
    "PLR2004",  # Magic value (sometimes acceptable)
    "TRY003",  # Avoid specifying long messages outside exception class
]

# Exclude patterns
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
    "target",  # Maven target directory
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["PLR2004", "ARG", "S101"]  # Allow asserts and magic values in tests

[tool.ruff.naming]
# Function naming: snake_case
function-rgx = "^[a-z_][a-z0-9_]*$"
# Class naming: PascalCase
class-rgx = "^[A-Z][a-zA-Z0-9]*$"
# Method naming: snake_case
method-rgx = "^[a-z_][a-z0-9_]*$"
# Variable naming: snake_case
variable-rgx = "^[a-z_][a-z0-9_]*$"
# Constant naming: UPPER_SNAKE_CASE
constant-rgx = "^[A-Z][A-Z0-9_]*$"
# Module naming: lowercase or snake_case
module-rgx = "^[a-z][a-z0-9_]*$"
# Private function/method: leading underscore
private-function-rgx = "^_[a-z_][a-z0-9_]*$"
private-method-rgx = "^_[a-z_][a-z0-9_]*$"
private-variable-rgx = "^_[a-z_][a-z0-9_]*$"

[tool.ruff.isort]
known-first-party = ["langgang"]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
strict = true
ignore_missing_imports = true  # For optional dependencies

[[tool.mypy.overrides]]
module = [
    "cookiecutter.*",
    "copier.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_community.*",
    "langgraph.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["langgang"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", "templates", ".venv", "venv"]
skips = ["B101", "B601"]  # Skip assert and shell injection (we handle manually)
