name: CI - Build, Test, and Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy
          pip install -r requirements.txt

      - name: Run Black formatter check
        run: black --check langgang/ tests/

      - name: Run Ruff linter
        run: ruff check langgang/ tests/

      - name: Run MyPy type checker
        run: mypy langgang/ --ignore-missing-imports
        continue-on-error: true

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=langgang --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-langgang
        continue-on-error: true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  mcp-server-test:
    name: Test MCP Servers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test MCP template server
        run: |
          python -c "from langgang.mcp_server import LangGangMCPServer; \
                     server = LangGangMCPServer(); \
                     templates = server.list_templates(); \
                     print(f'Templates found: {templates}'); \
                     assert 'cookiecutter' in templates, 'Cookiecutter templates not found'; \
                     assert 'copier' in templates, 'Copier templates not found'; \
                     assert 'maven' in templates, 'Maven templates not found'"

      - name: Test MCP documentation server
        run: |
          python -c "from langgang.docs_mcp_server import DocumentationMCPServer; \
                     server = DocumentationMCPServer(); \
                     docs = server.list_available_docs(); \
                     print(f'Docs available: {list(docs.keys())}'); \
                     assert 'langchain' in docs and 'langgraph' in docs"

      - name: Test LangChain integration
        run: |
          python -c "from langgang.langchain_integration import get_langgang_tools; \
                     tools = get_langgang_tools(); \
                     print(f'Tools count: {len(tools)}'); \
                     assert len(tools) == 2, 'Expected 2 LangChain tools'"
